name: Main Merge Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - AGENTS.md
      - README.md
      - plans/**
      - descriptions/**
      - front/prototypes/**
      - .DS_Store

concurrency:
  group: main-merge-gate-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  main_pr_full_gate:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      ADMIN_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_EMAIL_ALLOWLIST }}
      CMF_API_KEY: ${{ secrets.CMF_API_KEY }}
      BASE_ENDPOINT_CMF_UF: ${{ secrets.BASE_ENDPOINT_CMF_UF }}
      BASE_ENDPOINT_CMF_CARDS: ${{ secrets.BASE_ENDPOINT_CMF_CARDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if changed files are ignored by .gitignore
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
          DIFF_BASE="origin/${GITHUB_BASE_REF}"
          DIFF_HEAD="HEAD"

          CHANGED_FILES=$(git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}")
          if [[ -z "${CHANGED_FILES}" ]]; then
            echo "No changed files detected."
            exit 0
          fi

          BAD_FILES=()
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            if git check-ignore -q "${path}"; then
              BAD_FILES+=("${path}")
            fi
          done <<< "${CHANGED_FILES}"

          if (( ${#BAD_FILES[@]} > 0 )); then
            echo "Found changed tracked files that match .gitignore:"
            printf ' - %s\n' "${BAD_FILES[@]}"
            exit 1
          fi

          echo "No changed files match .gitignore."

      - name: Scan commit range for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
        with:
          args: --redact --verbose --log-opts="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Run full Python test suite (main gate)
        run: uv run pytest -q

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Lint frontend
        working-directory: front
        run: npm run lint

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Cleanup temporary build artifacts
        if: always()
        run: |
          rm -rf .pytest_cache
          rm -rf .ruff_cache
          rm -rf front/.next/cache
